name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests and helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Unit tests
        run: go test ./...

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.5

      - name: Helm lint and render
        run: |
          helm lint charts/trips-api
          helm template trips-api charts/trips-api >/dev/null
          helm template trips-api charts/trips-api --set ingress.enabled=true >/dev/null
          helm template trips-api charts/trips-api --set postgresql.enabled=false --set database.host=db.example >/dev/null

  kind:
    name: kind deploy and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t trips-api:ci .

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: trips
          wait: 180s

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.5

      - name: Point kubectl at the kind cluster
        run: |
          mkdir -p "${HOME}/.kube"
          kind get kubeconfig --name trips > "${HOME}/.kube/config"

      - name: Load images into kind
        run: |
          docker pull --platform linux/amd64 postgres:16-alpine
          kind load docker-image trips-api:ci --name trips
          kind load docker-image postgres:16-alpine --name trips

      - name: Install chart
        run: |
          helm upgrade --install trips-api charts/trips-api \
            --namespace trips \
            --create-namespace \
            --set image.repository=trips-api \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --wait \
            --timeout 4m

      - name: Wait for rollout
        run: |
          kubectl -n trips rollout status deployment/trips-api --timeout=180s
          kubectl -n trips rollout status deployment/trips-api-postgres --timeout=180s
          kubectl -n trips get deploy,svc,cm,secret,hpa

      - name: Assert chart resources
        run: |
          set -euo pipefail
          ns=trips
          kubectl -n "$ns" get deploy trips-api
          kubectl -n "$ns" get deploy trips-api-postgres
          kubectl -n "$ns" get svc trips-api
          kubectl -n "$ns" get svc trips-api-postgres
          kubectl -n "$ns" get configmap trips-api
          kubectl -n "$ns" get secret trips-api
          kubectl -n "$ns" get hpa trips-api
          if kubectl -n "$ns" get ingress trips-api >/dev/null 2>&1; then
            echo "ingress is disabled in the default install"
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          kubectl -n trips port-forward svc/trips-api 8080:80 >/tmp/pf.log 2>&1 &
          pf=$!
          cleanup() { kill "$pf" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              bash scripts/smoke.sh
              exit 0
            fi
            if ! kill -0 "$pf" 2>/dev/null; then
              echo "port-forward exited"
              cat /tmp/pf.log
              exit 1
            fi
            sleep 1
          done
          echo "timed out waiting for port-forward"
          cat /tmp/pf.log
          exit 1

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n trips get pods,svc,deploy,hpa,cm,ingress -o wide || true
          kubectl -n trips describe pods || true
          kubectl -n trips get events --sort-by='.lastTimestamp' || true
          kubectl -n trips logs -l app.kubernetes.io/component=api --tail=200 || true
          kubectl -n trips logs -l app.kubernetes.io/component=postgres --tail=200 || true
